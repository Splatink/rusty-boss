[package]
name = "rusty-boss"
version = "1.0.0"
edition = "2024"
rust-version = "1.99.1"
description = "Linux-first Katana Gen 3 editor and librarian with experimental Katana Air support"
license-file = "LICENSE"
readme = "README.md"
repository = "https://git.splatink.win/splatink/rusty-boss"

[features]
default = ["gui", "midi"]
gui = ["dep:eframe", "dep:rfd"]
midi = ["dep:alsa"]

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37.0", optional = true, default-features = false, features = ["clipboard", "default_fonts", "glow", "links", "wayland", "x11"] }
alsa = { version = "0.12.1", optional = true }
rfd = { version = "0.17.2", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
