[package]
name = "rusty-boss"
version = "0.1.0"
edition = "2021"
description = "Linux-first independent Katana Gen 3 editor and librarian"

[features]
default = ["gui", "midi"]
gui = ["dep:eframe"]
midi = ["dep:alsa"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
eframe = { version = "0.31.1", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
alsa = { version = "0.9.1", optional = true }

[dev-dependencies]
tempfile = "3.27"
